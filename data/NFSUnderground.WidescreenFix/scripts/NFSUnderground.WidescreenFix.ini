[MAIN]
ResX = 0                                 ; Use this option to control the horizontal resolution.
ResY = 0                                 ; Use this option to control the vertical resolution.
FixHUD = 1                               ; Corrects HUD aspect ratio.
FixFOV = 1                               ; Corrects FOV aspect ratio.
Scaling = 0                              ; Adjusts FOV aspect ratio to be mathematically correct. Requires FixFOV to be enabled.
HUDWidescreenMode = 1                    ; Moves HUD to the edge of the screen. Change offset in "NFSUnderground.WidescreenFix.dat" file for other aspect ratios. Requires FixHUD to be enabled.
FMVWidescreenMode = 1                    ; FMVs will appear in fullscreen for 16:9. (1 = Cropped | 2 = Stretched)

[MISC]
SkipIntro = 0                            ; Skips FMVs that play when you launch the game.
ShowLangSelect = 0                       ; Shows the language selector when you launch the game. Not with the Russian SoftClub release (its selector is broken, use Language instead).
Language = 0                             ; The game's language instead of the registry's, e.g. English US, German, Russian (Russian SoftClub only, its default). Use '0' for the registry's.
WindowedMode = 0                         ; Enables windowed mode. (1 = Borderless | 2 = Border | 3 = Resizable Border | 4 = Borderless Fullscreen | 5 = Borderless Fullscreen Stretched)
HideDebugObjects = 1                     ; Removes the debug objects next to the 4:3 menus. Has no effect with ClipFrontend = 1, which already hides them. (0 = Off | 1 = On)
ClipFrontend = 1                         ; Clips the menus to 4:3 (and the race results to 16:10 with HUDWidescreenMode = 0), hiding what the game draws outside of them. Requires FixHUD to be enabled.
CustomUserFilesDirectoryInGameDir = 0    ; User files will be stored in a specified directory (for example: "save"). Use '0' to disable.
ImproveGamepadSupport = 0                ; The pad drives the menus, right stick turns the car. Requires an XInput gamepad. (0 = Off | > 0 = On, 1 = Xbox, 2 = PlayStation, 3 = Original icons)
GamepadTheme = 0                         ; Pad icons and names from scripts\buttons\gamepad\<name> (folder or .zip). (0 = by ImproveGamepadSupport)
KeyboardTheme = 0                        ; Key icons from scripts\buttons\keyboard\<name> (folder or .zip), e.g. kenney. (0 = Original)
LeftStickDeadzone = 0.0                  ; Controls the deadzone of the left analog stick.
FPSLimit = 0                             ; Allows users to control the frame rate limit. (0 = Disabled | -1 = Monitor Refresh Rate | -2 = Double Monitor Refresh Rate)
BlackMagazineFix = 1                     ; Fixes the black background of the magazine covers with Motion Blur or Light Trails on (they are off while a magazine is shown).
SaveKeyboardBindings = 1                 ; Saves the keyboard bindings in "Keyboard.map" next to the profiles, so they are kept without dimap.dll.

[GRAPHICS]
MSAA = 0                                 ; Multisample antialiasing, switches Motion Blur and Light Trails off. DXVK: d3d9.forceSwapchainMSAA = -1, dgVoodoo: Antialiasing = appdriven. (0 = Off | 2 | 4 | 8)
