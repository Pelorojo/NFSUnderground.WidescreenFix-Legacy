; Icons: www.kenney.nl
; Theme: onlyami.ga
[Theme]
Name = Kenney Keyboard
Zoom = 1.15

; Key = icon file in this folder; all 11 key icons the game shows
[Icons]
Enter     = keyboard_enter_outline.png          ; next / confirm
Backspace = keyboard_backspace_icon_outline.png ; back
P         = keyboard_p_outline.png              ; performance
Z         = keyboard_z_outline.png              ; default / create room
C         = keyboard_c_outline.png              ; customize
T         = keyboard_t_outline.png              ; tutorial
D         = keyboard_d_outline.png              ; delete
Q         = keyboard_q_outline.png              ; quit
A         = keyboard_a_outline.png              ; agreement
H         = keyboard_h_outline.png              ; help
R         = keyboard_r_outline.png              ; race options
