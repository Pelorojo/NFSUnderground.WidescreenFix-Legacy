; Icons: www.kenney.nl
; Theme: onlyami.ga
[Theme]
Name = Steam Deck
Zoom = 1.15

; Button position as XInput reports it = icon file in this folder
[Icons]
A    = steamdeck_button_a_outline.png    ; bottom: next / confirm
B    = steamdeck_button_b_outline.png    ; right: back
X    = steamdeck_button_x_outline.png    ; left: performance
Y    = steamdeck_button_y_outline.png    ; top: default / create room
View = steamdeck_button_view_outline.png ; customize
LS   = steamdeck_stick_side_l.png        ; left stick click: tutorial
RS   = steamdeck_stick_side_r.png        ; right stick click: delete
Quit = steam_stick_side_l.png            ; both stick clicks: quit

; Button names in the controls menu (English); [Names.<code>] for a language, e.g. [Names.de], up to 22 characters max.
[Names]
A        = A
B        = B
X        = X
Y        = Y
LB       = L1
RB       = R1
View     = View (Select)
Menu     = Menu (Start)
LS       = L3
RS       = R3
DPadUp   = D-pad Up
DPadDown = D-pad Down
DPadLeft = D-pad Left
DPadRight= D-pad Right
RStickX  = Right stick Left/Right
RStickY  = Right stick Up/Down
LStickX  = Left stick Left/Right
LStickY  = Left stick Up/Down
Triggers = L2 / R2
DPad     = D-pad

[Names.de]
DPadUp   = Steuerkreuz oben
DPadDown = Steuerkreuz unten
DPadLeft = Steuerkreuz links
DPadRight= Steuerkreuz rechts
RStickX  = R-Stick links/rechts
RStickY  = R-Stick hoch/runter
LStickX  = L-Stick links/rechts
LStickY  = L-Stick hoch/runter
DPad     = Steuerkreuz
