; Icons: www.kenney.nl
; Theme: onlyami.ga
[Theme]
Name = PlayStation 3
Zoom = 1.15

; Button position as XInput reports it = icon file in this folder
[Icons]
A    = playstation_button_cross_outline.png    ; bottom: next / confirm
B    = playstation_button_circle_outline.png   ; right: back
X    = playstation_button_square_outline.png   ; left: performance
Y    = playstation_button_triangle_outline.png ; top: default / create room
View = playstation3_button_select_outline.png  ; customize
LS   = playstation_stick_side_l.png            ; left stick click: tutorial
RS   = playstation_stick_side_r.png            ; right stick click: delete
Quit = steam_stick_side_l.png                  ; both stick clicks: quit
