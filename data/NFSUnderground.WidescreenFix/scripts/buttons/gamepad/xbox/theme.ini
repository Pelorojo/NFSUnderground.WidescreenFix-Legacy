; Icons: www.kenney.nl
; Theme: onlyami.ga
[Theme]
Name = Xbox 360
Zoom = 1.15

; Button position as XInput reports it = icon file in this folder
[Icons]
A    = xbox_button_a_outline.png         ; bottom: next / confirm
B    = xbox_button_b_outline.png         ; right: back
X    = xbox_button_x_outline.png         ; left: performance
Y    = xbox_button_y_outline.png         ; top: default / create room
View = xbox_button_back_icon_outline.png ; customize
LS   = xbox_stick_side_l.png             ; left stick click: tutorial
RS   = xbox_stick_side_r.png             ; right stick click: delete
Quit = steam_stick_side_l.png            ; both stick clicks: quit
